<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
  <title>Level Devil - Fixed Live Multiplayer</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #88540b;
      overflow: hidden;
      touch-action: none;
      font-family: monospace;
    }
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #88540b;
    }
    canvas {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      display: block;
      background: #88540b;
      image-rendering: pixelated;
    }

    /* Controls */
    .controls-left {
      position: absolute;
      bottom: 22px;
      left: 70px;
      display: flex;
      gap: 36px;
      z-index: 10;
    }
    .controls-right {
      position: absolute;
      bottom: 22px;
      right: 70px;
      z-index: 10;
    }
    .arrow-btn {
      width: 95px;
      height: 46px;
      background: transparent;
      border: 3.5px solid #ffbe53;
      border-radius: 4px;
      touch-action: none;
    }
    .arrow-l { clip-path: polygon(24% 0%, 100% 0%, 100% 100%, 24% 100%, 0% 50%); }
    .arrow-r { clip-path: polygon(0% 0%, 76% 0%, 100% 50%, 76% 100%, 0% 100%); }
    .arrow-j { clip-path: polygon(50% 0%, 100% 32%, 100% 100%, 0% 100%, 0% 32%); }

    .arrow-btn:active, .arrow-btn.pressed {
      background: rgba(255, 190, 83, 0.4);
    }

    /* Death Pop-up Overlay */
    #death-popup {
      display: none;
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      z-index: 35;
      pointer-events: none;
      text-shadow: 0 2px 0 rgba(255, 190, 83, 0.8);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* Lobby Card */
    #lobby-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111;
      border: 2px solid #ffbe53;
      border-radius: 8px;
      padding: 16px 20px;
      color: #ffbe53;
      text-align: center;
      z-index: 30;
    }
    #room-code {
      width: 100px;
      font-size: 20px;
      text-align: center;
      background: #222;
      border: 1px solid #555;
      color: #fff;
      margin: 8px 0;
      text-transform: uppercase;
    }
    .lobby-btn {
      background: #ffbe53;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Victory Overlay */
    #win-screen {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 10, 0.92);
      border: 3px solid #ffbe53;
      padding: 24px 36px;
      border-radius: 12px;
      text-align: center;
      z-index: 40;
      box-shadow: 0 0 50px rgba(255, 190, 83, 0.6);
    }
    #win-screen h1 {
      color: #ffbe53;
      font-size: 24px;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    #win-screen p {
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div id="game-stage">
    <canvas id="view" width="640" height="360"></canvas>

    <!-- Death Pop-up Text -->
    <div id="death-popup">NOPE!</div>

    <!-- Lobby Card -->
    <div id="lobby-card">
      <div style="font-size: 13px;">ENTER 4-DIGIT ROOM</div>
      <input type="text" id="room-code" value="7788" maxlength="4"><br>
      <button class="lobby-btn" id="connect-btn">CONNECT WITH FRIEND</button>
      <button class="lobby-btn" id="solo-btn" style="background:#555; color:#fff; margin-left:6px;">SOLO</button>
    </div>

    <!-- Victory Screen -->
    <div id="win-screen">
      <h1>🏆 YOU DID IT!</h1>
      <p id="win-desc">YOU CONQUERED LEVEL DEVIL!</p>
      <button class="lobby-btn" id="play-again-btn">PLAY AGAIN</button>
    </div>

    <!-- Controls -->
    <div class="controls-left">
      <div class="arrow-btn arrow-l" id="btnL"></div>
      <div class="arrow-btn arrow-r" id="btnR"></div>
    </div>

    <div class="controls-right">
      <div class="arrow-btn arrow-j" id="btnJ"></div>
    </div>
  </div>

<script>
  // Render Server URL
  const WS_URL = 'wss://level-devil-game-ea0o.onrender.com';

  let ws = null;
  let playerNum = 1;
  let online = false;

  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d');
  const lobbyCard = document.getElementById('lobby-card');
  const winScreen = document.getElementById('win-screen');
  const winDesc = document.getElementById('win-desc');
  const playAgainBtn = document.getElementById('play-again-btn');
  const connectBtn = document.getElementById('connect-btn');
  const soloBtn = document.getElementById('solo-btn');
  const roomInput = document.getElementById('room-code');
  const deathPopup = document.getElementById('death-popup');

  const input = { left: false, right: false, jump: false, jumpPressed: false };

  // Snappy Tuned Physics
  const SPEED = 4.1;
  const GRAVITY = 0.62;
  const JUMP_FORCE = -11.8;
  const JUMP_CUT = 0.5;

  let cameraX = 0;
  let particles = [];
  let confetti = [];
  let statusText = 'OFFLINE';
  let gameFinished = false;
  let shake = 0;

  const DEATH_MESSAGES = ["NOPE!", "TOO BAD!", "OUCH!", "WATCH OUT!", "TRY AGAIN!"];

  const player = {
    x: 80, y: 200, w: 12, h: 22, vx: 0, vy: 0,
    grounded: false, alive: true, legCycle: 0,
    coyote: 0, jumpBuf: 0
  };

  const friend = {
    x: 80, y: 200, legCycle: 0, alive: true, connected: false
  };

  // 2400px Long Stage
  const STAGE = {
    length: 2400,
    door: { x: 2260, y: 204, w: 20, h: 36, fled: false },
    platforms: [
      { x: 0, y: 240, w: 320, h: 60, type: 'solid' },
      { x: 320, y: 240, w: 75, h: 60, type: 'collapse', vy: 0, state: 'idle', shakeTimer: 0, currentY: 240 },
      { x: 395, y: 240, w: 340, h: 60, type: 'solid' },
      { x: 790, y: 240, w: 60, h: 60, type: 'collapse', vy: 0, state: 'idle', shakeTimer: 0, currentY: 240 },
      { x: 910, y: 240, w: 420, h: 60, type: 'solid' },
      { x: 1400, y: 215, w: 75, h: 18, type: 'collapse', vy: 0, state: 'idle', shakeTimer: 0, currentY: 215 },
      { x: 1540, y: 240, w: 440, h: 60, type: 'solid' },
      { x: 2040, y: 240, w: 360, h: 60, type: 'solid' }
    ],
    spikes: [
      { x: 580, y: 240, w: 24, h: 18, state: 'hidden', heightAnim: 0 },
      { x: 1140, y: 240, w: 24, h: 18, state: 'hidden', heightAnim: 0 },
      { x: 1760, y: 240, w: 26, h: 18, state: 'hidden', heightAnim: 0 }
    ]
  };

  let arena = JSON.parse(JSON.stringify(STAGE));

  function resetLevel() {
    arena = JSON.parse(JSON.stringify(STAGE));
    player.x = 80;
    player.y = 200;
    player.vx = 0;
    player.vy = 0;
    player.alive = true;
    cameraX = 0;
    gameFinished = false;
    winScreen.style.display = 'none';
    deathPopup.style.display = 'none';
  }

  function showVictory(who) {
    gameFinished = true;
    winScreen.style.display = 'block';
    winDesc.textContent = who ? `${who} BEAT THE STAGE!` : 'YOU CONQUERED LEVEL DEVIL!';

    confetti = [];
    for (let i = 0; i < 60; i++) {
      confetti.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -50,
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 3 + 2,
        color: ['#ffbe53', '#ffffff', '#ef4444', '#22c55e'][Math.floor(Math.random() * 4)],
        size: Math.random() * 5 + 3
      });
    }
  }

  playAgainBtn.onclick = resetLevel;

  // Streamlined Live WebSocket Client
  function startOnline(room) {
    statusText = 'CONNECTING TO SERVER...';
    try {
      ws = new WebSocket(WS_URL);
    } catch(e) {
      statusText = 'OFFLINE (SOLO)';
      lobbyCard.style.display = 'none';
      return;
    }

    ws.onopen = () => {
      statusText = 'CONNECTED! JOINING ROOM...';
      ws.send(JSON.stringify({ type: 'join', room: room }));
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'joined') {
          playerNum = msg.pNum;
          online = true;
          statusText = `ROOM: ${msg.room} (YOU: P${playerNum})`;
          lobbyCard.style.display = 'none';
        }
        if (msg.type === 'ready') {
          friend.connected = true;
          statusText = 'FRIEND JOINED! BEAT IT TOGETHER!';
        }
        if (msg.type === 'oppMove') {
          friend.connected = true;
          friend.x = msg.x;
          friend.y = msg.y;
          friend.legCycle = msg.leg;
          friend.alive = msg.alive;
        }
        if (msg.type === 'trapTrigger') {
          const plat = arena.platforms[msg.id];
          if (plat && plat.type === 'collapse') plat.state = 'shake';
        }
        if (msg.type === 'stageWin') {
          showVictory(msg.winner === playerNum ? 'YOU' : 'YOUR FRIEND');
        }
      } catch(err) {
        console.error(err);
      }
    };

    ws.onerror = (err) => {
      console.log('WS Error:', err);
      statusText = 'CONNECTING... PLEASE WAIT';
    };

    ws.onclose = () => {
      if (!online) {
        statusText = 'SERVER NOT FOUND (PLAYING SOLO)';
        lobbyCard.style.display = 'none';
      }
    };
  }

  connectBtn.onclick = () => startOnline(roomInput.value.trim() || '7788');
  soloBtn.onclick = () => { lobbyCard.style.display = 'none'; statusText = 'SOLO MODE'; };

  function kill() {
    if (!player.alive || gameFinished) return;
    player.alive = false;
    shake = 15;

    deathPopup.textContent = DEATH_MESSAGES[Math.floor(Math.random() * DEATH_MESSAGES.length)];
    deathPopup.style.display = 'block';

    particles = [];
    for (let i = 0; i < 26; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 7 + 2;
      particles.push({
        x: player.x + 6,
        y: player.y + 11,
        size: Math.random() * 5 + 2,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 3,
        alpha: 1
      });
    }

    setTimeout(() => {
      resetLevel();
    }, 650);
  }

  // Touch Handlers
  function bindTouch(id, act) {
    const el = document.getElementById(id);
    const start = (e) => {
      e.preventDefault();
      if (act === 'jump') { input.jump = true; input.jumpPressed = true; }
      else { input[act] = true; }
      el.classList.add('pressed');
    };
    const end = (e) => {
      e.preventDefault();
      if (act === 'jump') { input.jump = false; }
      else { input[act] = false; }
      el.classList.remove('pressed');
    };
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
  }
  bindTouch('btnL', 'left');
  bindTouch('btnR', 'right');
  bindTouch('btnJ', 'jump');

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.key === 'a') input.left = true;
    if (e.code === 'ArrowRight' || e.key === 'd') input.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') {
      if (!input.jump) input.jumpPressed = true;
      input.jump = true;
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.key === 'a') input.left = false;
    if (e.code === 'ArrowRight' || e.key === 'd') input.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') input.jump = false;
  });

  function update() {
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.45;
      p.alpha -= 0.035;
      if (p.alpha <= 0) particles.splice(i, 1);
    }

    for (let i = 0; i < confetti.length; i++) {
      let c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      if (c.y > canvas.height) c.y = -10;
    }

    if (!player.alive || gameFinished) return;

    if (input.left) player.vx = -SPEED;
    else if (input.right) player.vx = SPEED;
    else player.vx = 0;

    if (player.grounded && player.vx !== 0) player.legCycle += 0.45;
    else player.legCycle = 0;

    if (input.jumpPressed) { player.jumpBuf = 5; input.jumpPressed = false; }
    else if (player.jumpBuf > 0) player.jumpBuf--;

    if (player.grounded) player.coyote = 5;
    else if (player.coyote > 0) player.coyote--;

    if (player.jumpBuf > 0 && player.coyote > 0) {
      player.vy = JUMP_FORCE;
      player.grounded = false;
      player.coyote = 0;
      player.jumpBuf = 0;
    }

    if (!input.jump && player.vy < 0) player.vy *= JUMP_CUT;

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    // Platform Collisions
    player.grounded = false;
    arena.platforms.forEach((plat, idx) => {
      if (plat.type === 'collapse') {
        if (plat.state === 'shake') {
          plat.shakeTimer++;
          if (plat.shakeTimer > 7) plat.state = 'falling';
        } else if (plat.state === 'falling') {
          plat.vy += 0.85;
          plat.currentY += plat.vy;
        }
      }

      const platY = plat.type === 'collapse' ? plat.currentY : plat.y;
      if (
        player.x + player.w * 0.8 > plat.x &&
        player.x + player.w * 0.2 < plat.x + plat.w &&
        player.y + player.h >= platY &&
        player.y + player.h <= platY + 14 &&
        player.vy >= 0
      ) {
        player.y = platY - player.h;
        player.vy = 0;
        player.grounded = true;
        if (plat.type === 'collapse' && plat.state === 'idle') {
          plat.state = 'shake';
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'trap', id: idx }));
          }
        }
      }
    });

    // Spikes Collisions
    arena.spikes.forEach((spk) => {
      if (spk.state === 'hidden' && player.x > spk.x - 42) spk.state = 'popping';
      if (spk.state === 'popping') {
        spk.heightAnim += 4.5;
        if (spk.heightAnim >= spk.h) {
          spk.heightAnim = spk.h;
          spk.state = 'active';
        }
      }
      if (spk.heightAnim > 2) {
        if (
          player.x + player.w > spk.x + 3 &&
          player.x < spk.x + spk.w - 3 &&
          player.y + player.h >= spk.y - spk.heightAnim &&
          player.y < spk.y
        ) {
          kill();
        }
      }
    });

    if (player.y > 280) kill();

    // Escape Door Trap
    if (!arena.door.fled && Math.abs(player.x - arena.door.x) < 70) {
      arena.door.fled = true;
      arena.door.x += 100;
    }

    // Door check
    const d = arena.door;
    if (
      player.x < d.x + d.w &&
      player.x + player.w > d.x &&
      player.y < d.y + d.h &&
      player.y + player.h > d.y
    ) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'win', winner: playerNum }));
      } else {
        showVictory('YOU');
      }
    }

    // Camera Focus
    let targetCamX = player.x - 220;
    targetCamX = Math.max(0, Math.min(targetCamX, STAGE.length - 640));
    cameraX += (targetCamX - cameraX) * 0.14;

    // Send position to friend continuously
    if (online && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        type: 'sync',
        x: Math.round(player.x),
        y: Math.round(player.y),
        leg: player.legCycle,
        alive: player.alive
      }));
    }
  }

  function drawFigurine(x, y, leg, color, label) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x + 6, y + 4, 3.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + 3.2, y + 7.2);
    ctx.lineTo(x + 8.8, y + 7.2);
    ctx.lineTo(x + 10.8, y + 17);
    ctx.lineTo(x + 1.2, y + 17);
    ctx.closePath();
    ctx.fill();

    const l = Math.sin(leg) * 3;
    ctx.fillRect(x + 2 + l, y + 17, 3, 5);
    ctx.fillRect(x + 7 - l, y + 17, 3, 5);

    ctx.fillStyle = color;
    ctx.font = '8px monospace';
    ctx.fillText(label, x - 1, y - 4);
  }

  function render() {
    ctx.save();

    if (shake > 0) {
      let ox = (Math.random() - 0.5) * shake;
      let oy = (Math.random() - 0.5) * shake;
      ctx.translate(ox, oy);
      shake *= 0.82;
      if (shake < 0.2) shake = 0;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dark Mustard Background
    ctx.fillStyle = '#88540b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-Math.round(cameraX), 0);

    // Long Apricot Corridor
    ctx.fillStyle = '#ffa734';
    ctx.fillRect(0, 168, STAGE.length, 72);

    // Pit Holes
    arena.platforms.forEach((plat) => {
      if (plat.type === 'collapse') {
        if (plat.state !== 'idle') {
          ctx.fillStyle = '#88540b';
          ctx.fillRect(plat.x, 240, plat.w, 60);
        }
        ctx.save();
        let shakeOffset = plat.state === 'shake' ? (Math.random() - 0.5) * 4 : 0;
        ctx.translate(plat.x, plat.currentY + shakeOffset);
        ctx.fillStyle = '#ffa734';
        ctx.fillRect(0, 0, plat.w, plat.h);
        ctx.fillStyle = '#88540b';
        ctx.fillRect(0, 0, plat.w, 2);
        ctx.restore();
      }
    });

    // Spikes
    arena.spikes.forEach((spk) => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillRect(spk.x, spk.y - 1, spk.w, 2);
      if (spk.heightAnim > 0) {
        ctx.fillStyle = '#000000';
        const numThorns = 3;
        const thornWidth = spk.w / numThorns;
        for (let t = 0; t < numThorns; t++) {
          const tx = spk.x + t * thornWidth;
          ctx.beginPath();
          ctx.moveTo(tx, spk.y);
          ctx.lineTo(tx + thornWidth / 2, spk.y - spk.heightAnim);
          ctx.lineTo(tx + thornWidth, spk.y);
          ctx.closePath();
          ctx.fill();
        }
      }
    });

    // Door
    const d = arena.door;
    ctx.fillStyle = '#9ca3af';
    ctx.beginPath();
    ctx.arc(d.x + d.w / 2, d.y + 10, d.w / 2, Math.PI, 0);
    ctx.lineTo(d.x + d.w, d.y + d.h);
    ctx.lineTo(d.x, d.y + d.h);
    ctx.closePath();
    ctx.fill();

    // Death Shatter Particles
    particles.forEach(p => {
      ctx.fillStyle = `rgba(0, 0, 0, ${p.alpha})`;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    // Friend Hero
    if (friend.connected && friend.alive) {
      drawFigurine(friend.x, friend.y, friend.legCycle, '#991b1b', 'P2');
    }

    // Local Hero
    if (player.alive) {
      drawFigurine(player.x, player.y, player.legCycle, '#000000', 'YOU');
    }

    ctx.restore();

    // Victory Confetti
    if (gameFinished) {
      confetti.forEach(c => {
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, c.size, c.size);
      });
    }

    // Status Banner
    ctx.fillStyle = '#ffbe53';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(statusText, 24, 26);

    ctx.restore();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
    </html>
