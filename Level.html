<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Level Devil - Smooth Online Co-op</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0;padding:0}
html,body{width:100%;height:100%;background:#88540b;overflow:hidden;touch-action:none;font-family:monospace;position:fixed}
#game-stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;object-fit:contain;display:block;background:#88540b;image-rendering:pixelated}
.controls-left{position:fixed;bottom:25px;left:25px;display:flex;gap:20px;z-index:999}
.controls-right{position:fixed;bottom:25px;right:25px;z-index:999}
.arrow-btn{width:75px;height:52px;background:rgba(255,190,83,.2);border:3px solid #ffbe53;border-radius:6px;touch-action:none;cursor:pointer}
.arrow-l{clip-path:polygon(30% 0,100% 0,100% 100%,30% 100%,0 50%)}
.arrow-r{clip-path:polygon(0 0,70% 0,100% 50%,70% 100%,0 100%)}
.arrow-j{clip-path:polygon(50% 0,100% 35%,100% 100%,0 100%,0 35%)}
.arrow-btn.pressed{background:rgba(255,190,83,.7)}
#death-popup{display:none;position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);color:#000;font-size:28px;font-weight:900;letter-spacing:2px;z-index:1000;pointer-events:none;text-shadow:0 2px 0 rgba(255,190,83,.8)}
#lobby-card{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#111;border:2px solid #ffbe53;border-radius:8px;padding:16px 20px;color:#ffbe53;text-align:center;z-index:1000}
#lobby-msg{font-size:11px;min-height:14px;margin-top:6px;color:#ef4444}
#room-code{width:100px;font-size:20px;text-align:center;background:#222;border:1px solid #555;color:#fff;margin:8px 0;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.lobby-btn{background:#ffbe53;color:#000;font-weight:bold;border:none;padding:8px 14px;border-radius:4px;cursor:pointer}
#win-screen{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,10,.95);border:3px solid #ffbe53;padding:24px 36px;border-radius:12px;text-align:center;z-index:1000}
#win-screen h1{color:#ffbe53;font-size:24px;margin-bottom:8px}
#win-screen p{color:#fff;font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<div id="game-stage">
  <canvas id="view" width="640" height="360"></canvas>
  <div id="death-popup">NOPE!</div>
  <div id="lobby-card">
    <div style="font-size:13px">ENTER 4-DIGIT ROOM</div>
    <input type="text" id="room-code" value="7788" maxlength="4" inputmode="numeric"><br>
    <button class="lobby-btn" id="connect-btn">CONNECT WITH FRIEND</button>
    <button class="lobby-btn" id="solo-btn" style="background:#555;color:#fff;margin-left:6px">SOLO</button>
    <div id="lobby-msg"></div>
  </div>
  <div id="win-screen">
    <h1>🏆 YOU DID IT!</h1>
    <p id="win-desc">YOU CONQUERED LEVEL DEVIL!</p>
    <button class="lobby-btn" id="play-again-btn">PLAY AGAIN</button>
  </div>
  <div class="controls-left">
    <div class="arrow-btn arrow-l" id="btnL"></div>
    <div class="arrow-btn arrow-r" id="btnR"></div>
  </div>
  <div class="controls-right"><div class="arrow-btn arrow-j" id="btnJ"></div></div>
</div>

<script>
const WS_URL = 'wss://level-devil-game-ea0o.onrender.com';
let ws = null, playerNum = 1, online = false, joined = false;

const $ = id => document.getElementById(id);
const canvas = $('view'), ctx = canvas.getContext('2d');
const lobbyCard = $('lobby-card'), lobbyMsg = $('lobby-msg'), winScreen = $('win-screen');
const winDesc = $('win-desc'), deathPopup = $('death-popup'), roomInput = $('room-code');

const input = { left:false, right:false, jump:false, jumpPressed:false };

const SPEED = 4.1, GRAVITY = 0.62, JUMP_FORCE = -11.8, JUMP_CUT = 0.5, MAX_FALL = 13;
const STEP = 1000 / 60; // fixed 60Hz logic so 90/120Hz phones don't run faster

let cameraX = 0, particles = [], confetti = [], statusText = 'OFFLINE';
let gameFinished = false, winSent = false, shake = 0, lastSyncTime = 0;

const DEATH_MESSAGES = ["NOPE!", "TOO BAD!", "OUCH!", "WATCH OUT!", "TRY AGAIN!"];

const player = { x:80, y:200, w:12, h:22, vx:0, vy:0, grounded:false, alive:true, legCycle:0, coyote:0, jumpBuf:0 };
const friend = { x:80, y:200, targetX:80, targetY:200, legCycle:0, alive:true, connected:false };

const STAGE = {
  length: 2400,
  door: { x:2260, y:204, w:20, h:36, fled:false },
  platforms: [
    { x:0,    y:240, w:320, h:60, type:'solid' },
    { x:320,  y:240, w:75,  h:60, type:'collapse', vy:0, state:'idle', shakeTimer:0, currentY:240 },
    { x:395,  y:240, w:340, h:60, type:'solid' },
    { x:790,  y:240, w:60,  h:60, type:'collapse', vy:0, state:'idle', shakeTimer:0, currentY:240 },
    { x:910,  y:240, w:420, h:60, type:'solid' },
    { x:1400, y:215, w:75,  h:18, type:'collapse', vy:0, state:'idle', shakeTimer:0, currentY:215 },
    { x:1540, y:240, w:440, h:60, type:'solid' },
    { x:2040, y:240, w:360, h:60, type:'solid' }
  ],
  spikes: [
    { x:580,  y:240, w:24, h:18, state:'hidden', heightAnim:0 },
    { x:1140, y:240, w:24, h:18, state:'hidden', heightAnim:0 },
    { x:1760, y:240, w:26, h:18, state:'hidden', heightAnim:0 }
  ]
};
let arena = JSON.parse(JSON.stringify(STAGE));

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}
function sendSync() {
  send({ type:'sync', x:Math.round(player.x), y:Math.round(player.y),
         leg:parseFloat(player.legCycle.toFixed(2)), alive:player.alive });
}

function resetLevel() {
  arena = JSON.parse(JSON.stringify(STAGE));
  Object.assign(player, { x:80, y:200, vx:0, vy:0, alive:true, grounded:false, coyote:0, jumpBuf:0, legCycle:0 });
  cameraX = 0;
  gameFinished = false;
  winSent = false;
  confetti = [];
  winScreen.style.display = 'none';
  deathPopup.style.display = 'none';
  if (online) sendSync(); // tell friend we're alive again
}

function showVictory(who) {
  if (gameFinished) return;
  gameFinished = true;
  winScreen.style.display = 'block';
  winDesc.textContent = who ? `${who} BEAT THE STAGE!` : 'YOU CONQUERED LEVEL DEVIL!';
  confetti = [];
  for (let i = 0; i < 60; i++) {
    confetti.push({
      x: Math.random() * canvas.width, y: Math.random() * -50,
      vx: (Math.random() - 0.5) * 4, vy: Math.random() * 3 + 2,
      color: ['#ffbe53','#ffffff','#ef4444','#22c55e'][Math.floor(Math.random() * 4)],
      size: Math.random() * 5 + 3
    });
  }
}
$('play-again-btn').onclick = resetLevel;

function startOnline(room) {
  if (ws) { try { ws.close(); } catch(e) {} }
  statusText = 'CONNECTING...';
  lobbyMsg.textContent = 'Connecting... (server may take ~30s to wake up)';
  joined = false;
  try { ws = new WebSocket(WS_URL); }
  catch(e) { lobbyMsg.textContent = 'Could not connect'; statusText = 'OFFLINE'; return; }

  ws.onopen = () => send({ type:'join', room });

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch(err) { return; }
    switch (msg.type) {
      case 'joined':
        playerNum = msg.pNum; online = true; joined = true;
        statusText = `ROOM: ${msg.room} (YOU: P${playerNum})`;
        lobbyCard.style.display = 'none';
        break;
      case 'ready':
        friend.connected = true;
        statusText = 'FRIEND JOINED! BEAT IT TOGETHER!';
        break;
      case 'oppMove':
        if (!friend.connected) { friend.x = msg.x; friend.y = msg.y; }
        friend.connected = true;
        friend.targetX = msg.x; friend.targetY = msg.y;
        friend.legCycle = msg.leg; friend.alive = msg.alive;
        break;
      case 'trapTrigger': {
        const plat = arena.platforms[msg.id];
        if (plat && plat.type === 'collapse' && plat.state === 'idle') plat.state = 'shake';
        break;
      }
      case 'stageWin':
        showVictory(msg.winner === playerNum ? 'YOU' : 'YOUR FRIEND');
        break;
    }
  };

  ws.onerror = () => { statusText = 'WS ERROR'; if (!joined) lobbyMsg.textContent = 'Connection error. Try again or play SOLO.'; };
  ws.onclose = () => {
    online = false; friend.connected = false;
    if (joined) statusText = 'DISCONNECTED (SOLO)';
    else if (!lobbyMsg.textContent.includes('error')) lobbyMsg.textContent = 'Connection closed. Try again.';
  };
}

$('connect-btn').onclick = () => startOnline(roomInput.value.trim() || '7788');
$('solo-btn').onclick = () => {
  if (ws) { try { ws.close(); } catch(e) {} }
  online = false; lobbyCard.style.display = 'none'; statusText = 'SOLO';
};

function kill() {
  if (!player.alive || gameFinished) return;
  player.alive = false;
  shake = 15;
  deathPopup.textContent = DEATH_MESSAGES[Math.floor(Math.random() * DEATH_MESSAGES.length)];
  deathPopup.style.display = 'block';
  particles = [];
  for (let i = 0; i < 26; i++) {
    const ang = Math.random() * Math.PI * 2, spd = Math.random() * 7 + 2;
    particles.push({ x:player.x + 6, y:player.y + 11, size:Math.random() * 5 + 2,
                     vx:Math.cos(ang) * spd, vy:Math.sin(ang) * spd - 3, alpha:1 });
  }
  if (online) sendSync(); // friend no longer sees a ghost of you
  setTimeout(resetLevel, 650);
}

function bindTouch(id, act) {
  const el = $(id);
  const start = (e) => {
    e.preventDefault();
    if (act === 'jump') { if (!input.jump) input.jumpPressed = true; input.jump = true; }
    else input[act] = true;
    el.classList.add('pressed');
  };
  const end = (e) => {
    e.preventDefault();
    input[act] = false;
    el.classList.remove('pressed');
  };
  el.addEventListener('touchstart', start, { passive:false });
  el.addEventListener('touchend', end, { passive:false });
  el.addEventListener('touchcancel', end, { passive:false });
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}
bindTouch('btnL','left'); bindTouch('btnR','right'); bindTouch('btnJ','jump');

function releaseAll() {
  input.left = input.right = input.jump = false;
  document.querySelectorAll('.arrow-btn').forEach(b => b.classList.remove('pressed'));
}
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
document.addEventListener('contextmenu', e => e.preventDefault());

const isJumpKey = e => e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW';
window.addEventListener('keydown', (e) => {
  if (e.target === roomInput) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  if (isJumpKey(e)) { e.preventDefault(); if (!input.jump) input.jumpPressed = true; input.jump = true; }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
  if (isJumpKey(e)) input.jump = false;
});

function update() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.45; p.alpha -= 0.035;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
  confetti.forEach(c => { c.x += c.vx; c.y += c.vy; if (c.y > canvas.height) c.y = -10; });

  if (friend.connected) {
    friend.x += (friend.targetX - friend.x) * 0.35;
    friend.y += (friend.targetY - friend.y) * 0.35;
  }

  if (!player.alive || gameFinished) return;

  player.vx = input.left ? -SPEED : input.right ? SPEED : 0;
  if (player.grounded && player.vx !== 0) player.legCycle += 0.45; else player.legCycle = 0;

  if (input.jumpPressed) { player.jumpBuf = 5; input.jumpPressed = false; }
  else if (player.jumpBuf > 0) player.jumpBuf--;

  if (player.grounded) player.coyote = 5; else if (player.coyote > 0) player.coyote--;

  if (player.jumpBuf > 0 && player.coyote > 0) {
    player.vy = JUMP_FORCE; player.grounded = false; player.coyote = 0; player.jumpBuf = 0;
  }
  if (!input.jump && player.vy < 0) player.vy *= JUMP_CUT;

  player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
  player.x = Math.max(0, Math.min(player.x + player.vx, STAGE.length - player.w));
  player.y += player.vy;

  player.grounded = false;
  arena.platforms.forEach((plat, idx) => {
    if (plat.type === 'collapse') {
      if (plat.state === 'shake') { if (++plat.shakeTimer > 7) plat.state = 'falling'; }
      else if (plat.state === 'falling') { plat.vy += 0.85; plat.currentY += plat.vy; }
    }
    const platY = plat.type === 'collapse' ? plat.currentY : plat.y;
    if (player.x + player.w * 0.8 > plat.x &&
        player.x + player.w * 0.2 < plat.x + plat.w &&
        player.y + player.h >= platY &&
        player.y + player.h <= platY + 14 &&
        player.vy >= 0) {
      player.y = platY - player.h; player.vy = 0; player.grounded = true;
      if (plat.type === 'collapse' && plat.state === 'idle') {
        plat.state = 'shake';
        send({ type:'trap', id:idx });
      }
    }
  });

  arena.spikes.forEach((spk) => {
    if (spk.state === 'hidden' && player.x > spk.x - 42) spk.state = 'popping';
    if (spk.state === 'popping') {
      spk.heightAnim += 4.5;
      if (spk.heightAnim >= spk.h) { spk.heightAnim = spk.h; spk.state = 'active'; }
    }
    if (spk.heightAnim > 2 &&
        player.x + player.w > spk.x + 3 && player.x < spk.x + spk.w - 3 &&
        player.y + player.h >= spk.y - spk.heightAnim && player.y < spk.y) kill();
  });

  if (player.y > 280) kill();
  if (!player.alive) return;

  if (!arena.door.fled && Math.abs(player.x - arena.door.x) < 70) {
    arena.door.fled = true; arena.door.x += 100;
  }
  const d = arena.door;
  if (player.x < d.x + d.w && player.x + player.w > d.x && player.y < d.y + d.h && player.y + player.h > d.y) {
    if (online) {
      if (!winSent) { winSent = true; send({ type:'win', winner:playerNum }); }
    } else showVictory('YOU');
  }

  const targetCamX = Math.max(0, Math.min(player.x - 220, STAGE.length - 640));
  cameraX += (targetCamX - cameraX) * 0.14;

  const now = Date.now();
  if (online && now - lastSyncTime > 50) { lastSyncTime = now; sendSync(); }
}

function drawFigurine(x, y, leg, color, label) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x + 6, y + 4, 3.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 3.2, y + 7.2); ctx.lineTo(x + 8.8, y + 7.2);
  ctx.lineTo(x + 10.8, y + 17); ctx.lineTo(x + 1.2, y + 17);
  ctx.closePath(); ctx.fill();
  const l = Math.sin(leg) * 3;
  ctx.fillRect(x + 2 + l, y + 17, 3, 5);
  ctx.fillRect(x + 7 - l, y + 17, 3, 5);
  ctx.font = '8px monospace';
  ctx.fillText(label, x - 1, y - 4);
}

function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.82; if (shake < 0.2) shake = 0;
  }
  ctx.fillStyle = '#88540b';
  ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);

  ctx.save();
  ctx.translate(-Math.round(cameraX), 0);
  ctx.fillStyle = '#ffa734';
  ctx.fillRect(0, 168, STAGE.length, 72);

  arena.platforms.forEach((plat) => {
    if (plat.type !== 'collapse') return;
    if (plat.state !== 'idle') { ctx.fillStyle = '#88540b'; ctx.fillRect(plat.x, 240, plat.w, 60); }
    const so = plat.state === 'shake' ? (Math.random() - 0.5) * 4 : 0;
    ctx.save();
    ctx.translate(plat.x, plat.currentY + so);
    ctx.fillStyle = '#ffa734'; ctx.fillRect(0, 0, plat.w, plat.h);
    ctx.fillStyle = '#88540b'; ctx.fillRect(0, 0, plat.w, 2);
    ctx.restore();
  });

  arena.spikes.forEach((spk) => {
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.fillRect(spk.x, spk.y - 1, spk.w, 2);
    if (spk.heightAnim > 0) {
      ctx.fillStyle = '#000';
      const n = 3, tw = spk.w / n;
      for (let t = 0; t < n; t++) {
        const tx = spk.x + t * tw;
        ctx.beginPath();
        ctx.moveTo(tx, spk.y); ctx.lineTo(tx + tw / 2, spk.y - spk.heightAnim); ctx.lineTo(tx + tw, spk.y);
        ctx.closePath(); ctx.fill();
      }
    }
  });

  const d = arena.door;
  ctx.fillStyle = '#9ca3af';
  ctx.beginPath();
  ctx.arc(d.x + d.w / 2, d.y + 10, d.w / 2, Math.PI, 0);
  ctx.lineTo(d.x + d.w, d.y + d.h); ctx.lineTo(d.x, d.y + d.h);
  ctx.closePath(); ctx.fill();

  particles.forEach(p => { ctx.fillStyle = `rgba(0,0,0,${Math.max(0, p.alpha)})`; ctx.fillRect(p.x, p.y, p.size, p.size); });

  if (friend.connected && friend.alive) drawFigurine(friend.x, friend.y, friend.legCycle, '#ef4444', 'P' + (playerNum === 1 ? 2 : 1));
  if (player.alive) drawFigurine(player.x, player.y, player.legCycle, '#000', 'YOU');
  ctx.restore();

  if (gameFinished) confetti.forEach(c => { ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, c.size, c.size); });

  ctx.fillStyle = '#ffbe53';
  ctx.font = 'bold 12px monospace';
  ctx.fillText(statusText, 24, 26);
  ctx.restore();
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 100);
  last = now;
  let steps = 0;
  while (acc >= STEP && steps < 5) { update(); acc -= STEP; steps++; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
  </html>
